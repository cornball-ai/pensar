name: ci

on:
  pull_request:

env:
  _R_CHECK_FORCE_SUGGESTS_: "false"
  # run.sh's own gate: R CMD check exits 0 on a WARNING and run_tests
  # passes that through, so a check ending "Status: 1 WARNING" is a
  # green tick. Set, run_tests greps 00check.log and fails the job.
  WARNINGS_ARE_ERRORS: "true"

jobs:
  ci:
    strategy:
      matrix:
        include:
          - {os: macos-latest}
          - {os: ubuntu-latest}

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v6

      - name: Setup
        uses: eddelbuettel/github-actions/r-ci@master
        with:
          # r2u binaries through rapt rather than bspm on ubuntu; the
          # macOS leg reads no backend.
          backend: RAPT

      - name: Dependencies
        run: ./run.sh install_deps

      - name: Test
        run: ./run.sh run_tests
